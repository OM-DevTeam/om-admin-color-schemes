name: "Draft new release"
run-name: "Draft release: `${{ inputs.version }}`"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        required: true

permissions:
  contents: write

jobs:

  draft-new-release:
    name: "Draft new release"
    runs-on: ubuntu-latest
    steps:

      # `secrets.GH_WORKFLOW_WRITE_PAT` — an org-level PAT belonging to an
      # account added to the OM-DevTeam org ruleset's bypass list — rather
      # than the default `GITHUB_TOKEN`, whose "github-actions[bot]" identity
      # isn't and can't be a ruleset bypass actor. actions/checkout wires
      # this token into the local git remote, so every plain `git push`
      # below (this step's direct push to master, and the tag push further
      # down) authenticates as that bypass-listed identity instead. Without
      # this, a direct push to master is rejected outright: `GH013:
      # Repository rule violations found for refs/heads/master` / "Changes
      # must be made through a pull request." See CLAUDE.md's "Releases"
      # section for the full story, including why the alternative (routing
      # every release through a PR) was tried first and abandoned — mainly
      # for the two-step "trigger, then go merge a PR" release flow it
      # forced, and for `pull_request`-triggered noise it added to the
      # Actions run list for every ordinary PR merged into master.
      - uses: actions/checkout@v7
        with:
          token: "${{ secrets.GH_WORKFLOW_WRITE_PAT }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: "Set version"
        run: bash dev/set-version.sh "${{ github.event.inputs.version }}"

      - run: npm run lint
      - run: npm run build

      # src/*.css is committed (see CLAUDE.md's "Build (SCSS)" section),
      # and the version bump above always changes at least
      # om-admin-color-schemes.php — this is what stops a tagged release
      # from silently shipping a stale plugin header or stale CSS if
      # someone forgot to run dev/set-version.sh / npm run build locally
      # before triggering a release. Nothing else in this job touches the
      # working tree, so an unscoped `git diff` here only ever reflects
      # the two steps above.
      #
      # Pushed straight to master — hardcoded, not derived from
      # `github.ref_name` — since there's no maintained second release
      # line for this plugin; releases only ever target master.
      - name: "Commit version bump and CSS rebuild"
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Release ${{ github.event.inputs.version }}"
            git push origin HEAD:master
          fi

      # Tagged here, ourselves, via plain git — rather than letting
      # action-gh-release below create the tag — so the tag always points
      # at the (possibly just-amended) commit above, not whatever ref the
      # workflow happened to start from.
      - name: "Tag the release"
        run: |
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: "Create release artifact"
        run: sh dev/create-release-files.sh

      # The default GITHUB_TOKEN is fine here (unlike the checkout step
      # above) — creating a GitHub Release isn't a protected-branch write,
      # so there's nothing for it to be rejected by.
      - name: "Draft new release"
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          tag_name: "${{ github.event.inputs.version }}"
          name: "${{ github.event.inputs.version }}"
          files: releases/om-admin-color-schemes.zip
